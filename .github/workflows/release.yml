name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
          bash scripts/test-install-systemd.sh
      - name: Build Linux release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=$RELEASE_TAG" \
              -o "dist/needs-attention-linux-$arch" ./cmd/needs-attention
          done
          tar -czf dist/needs-attention-systemd.tar.gz \
            scripts/install-systemd.sh systemd/needs-attention.service \
            config.example.json config.generic-example.json .env.example \
            glance/needs-attention.yml LICENSE README.md
          cd dist
          sha256sum needs-attention-linux-* needs-attention-systemd.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
